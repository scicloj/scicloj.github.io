project:
  type: website
  output-dir: _site
  # Only the Quarto sources are rendered. The legacy Hugo tree under content/
  # is left untouched until cutover.
  render:
    - "**/*.qmd"
    - "!content/**"
    - "!node_modules/**"
  # Regenerate the data-driven pages before every render, so they can never be
  # stale. Order matters: gen-libs writes a page that itself carries an
  # `author:`, which gen-contributors then indexes. Both write only when the
  # content actually changed, so `quarto preview` does not see its own output
  # and re-render in a loop. Requires babashka (see .github/workflows).
  pre-render:
    - scripts/gen-libs.clj
    - scripts/gen-contributors.clj
  post-render:
    - scripts/post-render.sh
  # Listed explicitly: glob patterns here are matched at any depth, which would
  # otherwise sweep in images from the legacy content/ and images/ trees.
  resources:
    - "android-chrome-192x192.png"
    - "android-chrome-512x512.png"
    - "apple-touch-icon.png"
    - "background.jpg"
    - "favicon-16x16.png"
    - "favicon-32x32.png"
    - "favicon.ico"
    - "sci-cloj-logo-name-transparent.png"
    - "sci-cloj-logo-name-transparent.svg"
    - "sci-cloj-logo-transparent.png"
    - "sci-cloj-logo-transparent.svg"
    - "site.webmanifest"
    - "robots.txt"
    # Keep the legacy Hugo tree out of the published site.
    - "!content/**"
    - "!images/**"

